[build-system]
requires = ["setuptools>=69.4"]
build-backend = "setuptools.build_meta"

[project]
name = "pyturk"
version = "0.0.1"
authors = [
    { name = "Sebastian Fest", email = "sebsatian.fest@gmail.com" },
]
description = "A simple client for MTurk."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["MTurk", "Client"]
license = { text = "MIT License" }
classifiers = [
    'Development Status :: 1 - Planning',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: MIT License',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python :: 3.11',
]
dependencies = [
    "boto3>=1.34.15",
    "mypy-boto3-mturk>=1.34.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "coverage"
]
